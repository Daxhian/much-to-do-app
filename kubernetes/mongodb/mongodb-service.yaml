apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: muchtodo
spec:
  selector:
    app: mongodb           # Matches the pod label in the deployment
  ports:
    - protocol: TCP
      port: 27017          # Port other pods use to reach MongoDB
      targetPort: 27017    # Port MongoDB listens on inside the container
  type: ClusterIP          # Internal only — MongoDB should never be exposed externally
