apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: muchtodo
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80             # Port the service listens on inside the cluster
      targetPort: 8080     # Port the backend container listens on
      nodePort: 30080      # Port exposed on the Kind node (access via localhost:30080)
  type: NodePort           # Exposes on each node's IP — required for Kind local access
